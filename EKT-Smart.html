function chart(lines,{labels=[],bands=[],height=245}={}){const W=760,H=height,L=56,T=22,B=36,R=18,all=lines.flatMap(l=>l.values),max=Math.max(1,...all)*1.1,n=Math.max(2,...lines.map(l=>l.values.length)),x=i=>L+i/(n-1)*(W-L-R),y=v=>H-B-v/max*(H-T-B);return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lines.map(l=>l.label).join(', '))}">${bands.map(b=>`<rect x="${x(b)}" y="${T}" width="${Math.max(2,(W-L-R)/n)}" height="${H-T-B}" fill="#fff0d6"/>`).join('')}${[0,.25,.5,.75,1].map(k=>`<line x1="${L}" x2="${W-R}" y1="${y(max*k)}" y2="${y(max*k)}" stroke="#e7edf5"/><text x="${L-9}" y="${y(max*k)+4}" text-anchor="end" fill="#71829b" font-size="19">${fmt(Math.round(max*k))}</text>`).join('')}${lines.map(l=>`<polyline fill="none" stroke="${l.color}" stroke-width="${l.width||2.5}" ${l.dash?'stroke-dasharray="6 5"':''} points="${l.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`).join('')}${[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${x(i)}" y="${H-9}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" fill="#71829b" font-size="19">${esc(labels[i]||'')}</text>`).join('')}</svg><div class="legend">${lines.map(l=>`<span><i style="background:${l.color}"></i>${esc(l.label)}</span>`).join('')}${bands.length?'<span>Бежевый фон — отсутствие товара</span>':''}</div>`;}

енд: <b>${fmt(r.model.slope*100)}% в день</b></div><div class="statline">Дополнительный прирост: <b>${r.model.cfg.additional_growth_pct}%</b></div>${r.risk!==null&&r.risk<r.lead?'<p class="callout warning">Обычная новая поставка не успеет предотвратить ближайший дефицит.</p>':''}</div></div><h2>Ожидаемые поставки</h2>${db.inbound.filter(i=>i.sku===r.sku&&i.warehouse_id===r.warehouse_id).map(i=>`<p class="pill">${esc(i.expected_date)} · ${fmt(i.quantity)} ${esc(r.unit)} · ${i.status==='confirmed'?'Подтверждена':'Не подтверждена'}</p>`).join('')||'<p class="muted">Нет поставок в пути</p>'}`;$('#close-detail').onclick=()=>dialog.close();dialog.showModal();}
function futurePage(){const rr=rows(),r=rr.find(x=>EKT.key(x.sku,x.warehouse_id)===focusSku)||rr[0];if(!r)return filters()+'<div class="empty">Нет товаров для прогноза</div>';focusSku=EKT.key(r.sku,r.warehouse_id);const before=EKT.simulate(db,r,r.warehouse_id,r.model,scenario),after=EKT.simulate(db,r,r.warehouse_id,r.model,{...scenario,order:r.qty}),at=before[scenario.day],futureRows=rr.map(x=>({r:x,path:EKT.simulate(db,x,x.warehouse_id,x.model,scenario)})),risks=futureRows.filter(x=>x.path[scenario.day].missing>0),totalLoss=EKT.sum(before.slice(0,scenario.day+1).map(x=>x.missing));return filters()+`<div class="grid"><section class="panel"><div class="row"><h2>Будущее склада</h2><span class="badge">Сценарий · не меняет заказы</span></div><p class="range-value">${EKT.add(db.date,scenario.day)} <span class="muted">через ${scenario.day} дней</span></p><input type="range" id="day" min="0" max="60" value="${scenario.day}" aria-label="День прогноза"><div class="row muted"><span>Сегодня</span><span>Через 60 дней</span></div><div class="split" style="margin-top:24px"><label>Задержка поставок, дней<br><input type="number" id="delay" min="0" max="60" value="${scenario.delay}"></label><label>Изменение спроса, %<br><input type="number" id="growth" min="-90" max="200" value="${scenario.growth}"></label></div><p><button id="reset-scenario">Сбросить сценарий</button></p><div class="callout">На выбранную дату дефицит прогнозируется у <b>${risks.length}</b> позиций. Данные сценария не записываются в историю продаж.</div></section><section class="panel"><h2>Выберите товар</h2><select id="future-sku" style="width:100%">${options(rr.map(x=>[EKT.key(x.sku,x.warehouse_id),x.name+' / '+wh(x.warehouse_id)]),focusSku)}</select><div class="statline row"><span>Остаток на выбранную дату</span><b>${fmt(at.stock)} ${esc(r.unit)}</b></div><div class="statline row"><span>Упущенный спрос до этой даты</span><b>${fmt(totalLoss)} ${esc(r.unit)}</b></div><div class="statline row"><span>Предлагаемый зак function detective(){const aa=calc.anomalies.filter(a=>(!warehouse||a.warehouse_id===warehouse)&&(!category||db.products.find(p=>p.sku===a.sku)?.category===category)).sort((a,b)=>b.quantity-a.quantity);return filters()+`<div class="callout" style="margin-bottom:20px">Необычная покупка не всегда ошибка. Проверьте разовые проекты: ваше решение изменит прогноз, но сохранит исходные продажи. Крупные покупки одного клиента, повторившиеся минимум 3 раза, автоматически сохраняются в спросе.</div><div class="table-wrap"><table><thead><tr><th>Товар / дата</th><th>Клиент</th><th>Объём</th><th>Почему отмечено</th><th>Решение закупщика</th></tr></thead><tbody>${aa.map(a=>`<tr><td><button class="link" data-detail="${esc(EKT.key(a.sku,a.warehouse_id))}">${esc(db.products.find(p=>p.sku===a.sku)?.name||a.sku)}</button><small>${a.date} · ${esc(wh(a.warehouse_id))}</small></td><td>${esc(a.customer_id)}</td><td class="num"><b>${fmt(a.quantity)}</b></td><td>Типичная покупка: ${fmt(a.median)}<small>Порог: ${fmt(a.threshold)} · Крупных покупок клиента: ${a.recurrence}</small><small>${a.excluded?'Исключена из прогноза':'Сохранена в прогнозе'} · ${a.confidence}</small></td><td><select data-decision="${esc(a.id)}" aria-label="Решение для покупки ${esc(a.id)}">${options([['auto','Автоматически'],['oneoff','Разовая покупка'],['regular','Регулярный спрос']],a.decision)}</select></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Подозрительных покупок не найдено</td></tr>'}</tbody></table></div>`;}
function makeOrders(){const picks=calc.rows.filter(r=>selected.has(EKT.key(r.sku,r.warehouse_id))&&r.qty>0);if(!picks.length){toast('Выберите позиции с ненулевой потребностью');return;}const groups=new Map();for(const r of picks){const k=EKT.key(r.supplier_id,r.warehouse_id);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);}for(const rr of groups.values())db.orders.push({id:uid(),number:'ЗК-'+String(db.orders.length+1).padStart(4,'0'),supplier_id:rr[0].supplier_id,warehouse_id:rr[0].warehouse_id,status:'draft',created:new Date().toISOString(),comment:'',items:rr.map(r=>({sku:r.sku,name:r.name,unit:r.unit,quantity:r.qty,purchase_price:r.purchase_price}))});selected.clear();page='orders';save();render();toast('Черновики созданы по поставщикам и складам');}

function dataPage(){return `<div class="grid"><section class="panel"><h2>Загрузить данные компании</h2><p class="muted">Один XLSX с листами шаблона или CSV для выбранной таблицы. Даты: ГГГГ-ММ-ДД. Файлы обрабатываются на устройстве.</p><div class="stack"><label>Таблица для CSV <select id="csv-type">${options(Object.keys(schemas).map(s=>[s,s]),'sales')}</select></label><label>Файл <input type="file" id="import-file" accept=".xlsx,.csv"></label><button id="template">Скачать шаблон Excel</button><button id="demo-file">Скачать текущие данные Excel</button></div><p class="muted">Импорт заменяет только переданные таблицы после проверки и подтверждения. Для первой загрузки заполните все листы Excel. Формат XLS не поддерживается.</p>${importReport?`<div class="callout"><pre>${esc(importReport)}</pre></div>`:''}</section><section class="panel"><h2>Сохранение и резервная копия</h2><p class="muted">Рабочие данные хранятся в этом браузере. При переносе HTML-файла, смене браузера или очистке его данных сохранения могут стать недоступны.</p><div class="stack"><button id="backup">Скачать резервную копию JSON</button><label>Восстановить копию <input type="file" id="restore" accept=".json"></label><button id="reset-demo">Загрузить демонстрационные данные</button></div><p class="muted">Последний импорт: ${db.imported?new Date(db.imported).toLocaleString('ru-RU'):'не выполнялся'}</p><p><label>Расчётная дата <input id="calc-date" type="date" value="${db.date}"></label></p><p class="muted">Продажи с этой даты и позднее не используются. Остатки должны быть актуальны на эту дату.</p></section></div><section class="panel"><h2>Настройки категорий</h2><p class="muted">Прирост — дополнительный сценарий сверх тренда, уже найденного в истории. Оставьте 0%, если рост уже отражён в продажах.</p><div class="table-wrap"><table><thead><tr><th>Категория</th><th>Доп. прирост, %</th><th>Пересмотр, дней</th><th>Страховой запас, дней</th></tr></thead><tbody>${db.category_settings.map((c,i)=>`<tr><td>${esc(c.category)}</td>${['additional_growth_pct','review_period_days','safety_stock_days'].map(f=>`<td><input aria-label="${esc(c.category+' '+f)}" type="number" min="${f==='additional_growth_pct'?-90:0}" max="${f==='additional_growth_pct'?300:90}" value="${c[f]}" data-setting="${i}|${f}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Как работает расчёт</h2><p class="muted">Модель выделяет разовые покупки, восстанавливает спрос в дни отсутствия товара и оценивает месячную сезонность при истории от 650 дней. Уровень спроса рассчитывается по последним 56 дням после удаления сезонности; тренд — линейной оценкой по последним 180 дням, с ограничением ±0,5% в день. Дни без продаж считаются нулём только вне заданных stockout.</p><p class="muted">Страховой запас задаётся в днях спроса. Заказ покрывает срок поставки и период пересмотра. Поздние поставки не скрывают ранний дефицит на графике. Это статистический прототип, не обученная на данных компании промышленная модель.</p><details><summary>Состояние набора данных</summary><pre>${esc(Object.keys(schemas).map(k=>k+': '+db[k].length+' строк').join('\n'))}</pre><p class="muted">${db.inventory.filter(i=>i.as_of_date!==db.date).length} остатков имеют дату, отличную от расчётной. ${calc.rows.filter(r=>r.model.days<90).length} позиций с короткой историей.</p></details></section>`;}

function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';urgency='';render();window.scrollTo(0,0);});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));for(const [id,fn] of Object.entries({warehouse:v=>warehouse=v,category:v=>category=v,urgency:v=>urgency=v,sort:v=>sort=v}))if($('#'+id))$('#'+id).onchange=e=>{fn(e.target.value);selected.clear();render();};if($('#search'))$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);};document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{b.checked?selected.add(b.dataset.select):selected.delete(b.dataset.select);$('#create-orders').textContent=`Создать черновики (${selected.size})`;});if($('#select-needed'))$('#select-needed').onclick=()=>{rows().filter(r=>r.qty>0).forEach(r=>selected.add(EKT.key(r.sku,r.warehouse_id)));render();};if($('#create-orders'))$('#create-orders').onclick=makeOrders;if($('#export-recommend'))$('#export-recommend').onclick=()=>Files.download(Files.workbook({'Рекомендации':rows().map(r=>({'Артикул':r.sku,'Товар':r.name,'Склад':wh(r.warehouse_id),'Поставщик':r.supplier_name,'Единица':r.unit,'Остаток':r.on_hand,'В пути':r.inbound,'Спрос':+r.demand.toFixed(2),'Резерв':+r.safety.toFixed(2),'Заказать':r.qty,'Цена':r.purchase_price,'Сумма':r.amount??'','Срочность':r.urgency,'Обоснование':`Спрос ${fmt(r.demand)} + резерв ${fmt(r.safety)} - остаток ${r.on_hand} - поставки ${r.timely}; упаковка ${r.pack_size}`}))}),'EKT-рекомендации.xlsx');for(const id of ['day','delay','growth'])if($('#'+id))$('#'+id).oninput=e=>{const v=Number(e.target.value),lo=id==='growth'?-90:0,hi=id==='growth'?200:60;if(Number.isFinite(v)&&v>=lo&&v<=hi){scenario[id]=Math.round(v);if(id==='day'){const el=e.target;el.onchange=()=>render();}else e.target.onchange=()=>render();}};if($('#reset-scenario'))$('#reset-scenario').onclick=()=>{scenario={day:14,delay:0,growth:0};render();};if($('#future-sku'))$('#future-sku').onchange=e=>{focusSku=e.target.value;render();};document.querySelectorAll('[data-decision]').forEach(b=>b.onchange=()=>{db.decisions[b.dataset.decision]=b.value;recalc();toast('Решение сохранено. Прогноз пересчитан.');});document.querySelectorAll('[data-qty]').forEach(b=>b.onchange=()=>{const [id,idx]=b.dataset.qty.split('|'),o=db.orders.find(o=>o.id===id),v=Number(b.value);if(o.status!=='draft')return;if(!Number.isFinite(v)||v<=0){toast('Количество должно быть больше нуля');render();return;}o.items[idx].quantity=v;save();render();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const [id,idx]=b.dataset.remove.split('|'),o=db.orders.find(o=>o.id===id);if(o.status==='draft'){o.items.splice(+idx,1);save();render();}});document.querySelectorAll('[data-comment]').forEach(b=>b.onchange=()=>{const o=db.orders.find(o=>o.id===b.dataset.comment);if(o.status==='draft'){o.comment=b.value;save();}});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const o=db.orders.find(o=>o.id===b.dataset.approve);if(o.status!=='draft'||!o.items.length)return;if(!confirm('Утвердить '+o.number+'? Состав заказа будет зафиксирован.'))return;o.status='approved';o.approved=new Date().toISOString();save();render();toast('Заказ утверждён. Отправка поставщику не выполнялась.');});for(const type of ['xlsx','csv'])document.querySelectorAll('[data-order-'+type+']').forEach(b=>b.onclick=()=>{const o=db.orders.find(o=>o.id===b.getAttribute('data-order-'+type)),r=orderRows(o);Files.download(type==='xlsx'?Files.workbook({'Заказ':r}):Files.csv(r),o.number+'.'+type);});bindData();}
function validate(candidate){const errors=[],warnings=[],numbers=new Set(['purchase_price','pack_size','min_order_qty','lead_time_days','quantity','selling_price','on_hand','additional_growth_pct','review_period_days','safety_stock_days']),dates=new Set(['date','as_of_date','expected_date','start_date','end_date']);let accepted=0;for(const [type,fields] of Object.entries(schemas)){if(!Array.isArray(candidate[type])){errors.push(type+': отсутствует таблица');continue;}const seen=new Set();candidate[type]=candidate[type].map((row,index)=>{const r={};let ok=true;const err=t=>{errors.push(`${type}, строка ${index+2}: ${t}`);ok=false;};for(const f of fields){let v=row[f];if(v==null)v='';if(dates.has(f)){if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(v))v=EKT.add('1899-12-30',Math.floor(+v));v=String(v).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||!Number.isFinite(Date.parse(v))||new Date(v).toISOString().slice(0,10)!==v)err(f+': неверная дата');}else if(numbers.has(f)){if(v===''&&['purchase_price','selling_price'].includes(f)){r[f]='';continue;}if(v===''||!Number.isFinite(Number(String(v).replace(',','.'))))err(f+': требуется число');v=Number(String(v).replace(',','.'));if(f==='additional_growth_pct'?(v< -90||v>300):v<0)err(f+': значение вне диапазона');if(['pack_size','quantity'].includes(f)&&v<=0)err(f+': должно быть больше нуля');if(['lead_time_days','review_period_days','safety_stock_days'].includes(f)&&(!Number.isInteger(v)||v>180))err(f+': целое число 0–180');}else{v=String(v).trim();if(!v)err(f+': обязательное поле');if(v.length>300)err(f+': слишком длинное значение');}r[f]=v;}if(type==='inbound'&&!['confirmed','pending'].includes(r.status))err('status: confirmed или pending');if(type==='stockouts'&&r.end_date<r.start_date)err('конец периода раньше начала');const k=type==='inventory'?EKT.key(r.sku,r.warehouse_id):type==='stockouts'?[r.sku,r.warehouse_id,r.start_date,r.end_date].join('|'):r[{products:'sku',suppliers:'supplier_id',warehouses:'warehouse_id',sales:'sale_id',inbound:'inbound_id',category_settings:'category'}[type]];if(seen.has(k))err('дубликат идентификатора '+k);seen.add(k);if(ok)accepted++;return r;});}
 const products=new Set(candidate.products?.map(p=>p.sku)),suppliers=new Set(candidate.suppliers?.map(p=>p.supplier_id)),warehouses=new Set(candidate.warehouses?.map(p=>p.warehouse_id));for(const type of ['products','sales','inventory','inbound','stockouts'])for(const [i,r] of (candidate[type]||[]).entries()){if(type!=='products'&&!products.has(r.sku))errors.push(`${type}, строка ${i+2}: неизвестный sku ${r.sku}`);if(r.supplier_id&&!suppliers.has(r.supplier_id))errors.push(`${type}, строка ${i+2}: неизвестный поставщик`);if(r.warehouse_id&&!warehouses.has(r.warehouse_id))errors.push(`${type}, строка ${i+2}: неизвестный склад`);}
 for(const p of candidate.products||[])if(!candidate.category_settings.some(c=>c.category===p.category))errors.push('Нет настроек категории '+p.category);if(!candidate.inventory?.length)warnings.push('Нет остатков: рекомендации будут пустыми');if(candidate.inventory?.some(i=>i.as_of_date!==candidate.date))warnings.push('Некоторые остатки не соответствуют расчётной дате');if(candidate.products?.some(p=>p.purchase_price===''))warnings.push('Есть товары без закупочной цены');const intervals=new Map();for(const s of candidate.stockouts||[]){const k=EKT.key(s.sku,s.warehouse_id);if(!intervals.has(k))intervals.set(k,[]);intervals.get(k).push(s);}for(const r of candidate.sales||[])if(intervals.get(EKT.key(r.sku,r.warehouse_id))?.some(s=>r.date>=s.start_date&&r.date<=s.end_date)){warnings.push('Есть продажи в дни полного stockout. Проверьте периоды отсутствия.');break;}return {errors,warnings,accepted};}
async function importFile(file,type){if(!file)return;try{if(file.size>30*1024*1024)throw Error('Файл больше 30 МБ. Разделите данные на меньшие наборы.');toast('Проверяем файл…');const tables=file.name.toLowerCase().endsWith('.xlsx')?await Files.readXlsx(await file.arrayBuffer()):{[type]:Files.csvRows(await file.text())},known=Object.keys(tables).filter(k=>schemas[k]);if(!known.length)throw Error('Не найдены листы шаблона: '+Object.keys(schemas).join(', '));let candidate=structuredClone(db);for(const k of known)candidate[k]=tables[k];if(tables.inventory?.length)candidate.date=String(tables.inventory[0].as_of_date);if(/^\d{5}$/.test(candidate.date))candidate.date=EKT.add('1899-12-30',+candidate.date);const result=validate(candidate);importReport=`Проверено строк без полевых ошибок: ${result.accepted}\nОшибок: ${result.errors.length}\n${result.errors.slice(0,30).join('\n')}\n${result.warnings.join('\n')}`;if(result.errors.length){render();toast('Импорт отменён: исправьте ошибки в файле');return;}if(!confirm(`Заменить таблицы: ${known.join(', ')}? Ручные решения по аномалиям будут сброшены. Заказы сохранятся.\n${result.warnings.join('\n')}`)){importReport+='\nЗамена отменена пользователем.';render();return;}candidate.demo=false;candidate.imported=new Date().toISOString();candidate.decisions={};db=candidate;warehouse='';category='';recalc();toast('Данные загружены, рекомендации пересчитаны');}catch(e){importReport='Ошибка: '+e.message;render();toast('Не удалось загрузить файл');}}
function bindData(){if(page!=='data')return;$('#import-file').onchange=e=>importFile(e.target.files[0],$('#csv-type').value);$('#template').onclick=()=>Files.download(Files.workbook(Object.fromEntries(Object.entries(schemas).map(([k,fields])=>[k,[fields]]))),'EKT-шаблон.xlsx');$('#demo-file').onclick=()=>Files.download(Files.workbook(Object.fromEntries(Object.keys(schemas).map(k=>[k,db[k].length?db[k]:[schemas[k]]]))),'EKT-данные.xlsx');$('#backup').onclick=()=>Files.download(new Blob([JSON.stringify(db)],{type:'application/json'}),'EKT-резервная-копия.json');$('#restore').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>80*1024*1024)throw Error('Слишком большой файл');const candidate=JSON.parse(await file.text());if(candidate.version!==1||!Array.isArray(candidate.orders)||!candidate.decisions||!/^\d{4}-\d{2}-\d{2}$/.test(candidate.date))throw Error('Неверный формат резервной копии');const v=validate(candidate);if(v.errors.length)throw Error(v.errors.slice(0,3).join('\n'));if(!candidate.orders.every(o=>typeof o.id==='string'&&['draft','approved'].includes(o.status)&&Array.isArray(o.items)&&o.items.every(i=>Number.isFinite(i.quantity)&&i.quantity>0)))throw Error('Неверный формат заказов');if(confirm('Восстановить копию? Текущие данные и заказы будут заменены.')){db=candidate;warehouse='';category='';recalc();toast('Копия восстановлена');}}catch(err){toast(err.message);}};$('#reset-demo').onclick=()=>{if(confirm('Заменить все данные, решения и заказы демонстрационным набором?')){db=EKT.demo();warehouse='';category='';importReport='';recalc();toast('Демонстрационные данные восстановлены');}};$('#calc-date').onchange=e=>{if(!e.target.value)return;db.date=e.target.value;recalc();toast('Дата изменена. Проверьте актуальность остатков.');};document.querySelectorAll('[data-setting]').forEach(el=>el.onchange=()=>{const [i,f]=el.dataset.setting.split('|'),v=+el.value;if(!Number.isFinite(v)||v<+el.min||v>+el.max||f!=='additional_growth_pct'&&!Number.isInteger(v)){toast('Проверьте допустимый диапазон');render();return;}db.category_settings[i][f]=v;recalc();toast('Рекомендации пересчитаны');});}
async function start(){try{const s=await openStore();db=await new Promise((res,rej)=>{const r=s.transaction('state').objectStore('state').get('db');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});s.close();storageReady=true;}catch(e){storageReady=false;}if(!db)db=EKT.demo();calc=EKT.calculate(db);render();if(storageReady)save();else toast('Автосохранение недоступно. Используйте резервную копию JSON.');const ctx=document.modelContext;if(ctx?.registerTool){try{await ctx.registerTool({name:'read_replenishment_recommendations',description:'Read current calculated purchase recommendations; does not create orders.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:input=>{if(!input||Object.keys(input).length)throw Error('No arguments supported');return rows().map(r=>({sku:r.sku,warehouse:r.warehouse_id,quantity:r.qty,urgency:r.urgency}));}});}catch(e){/* Optional browser capability. */}}}
start().catch(e=>{$('#app').innerHTML='<h1>Не удалось открыть данные</h1><p>Попробуйте другой браузер или восстановите резервную копию. Подробности: '+esc(e.message)+'</p>';});
</script></body></html>
